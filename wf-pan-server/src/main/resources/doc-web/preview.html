<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>文档预览</title>
<link rel="stylesheet" href="app.css">
<script src="app.js"></script>
<style>
  html, body { height: 100%; }
  .preview-page { display: flex; flex-direction: column; height: 100%; background: #525659; }
  .preview-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: #fff; border-bottom: 1px solid rgba(0,0,0,.08);
    flex-shrink: 0;
  }
  .preview-bar .grow { flex: 1; min-width: 0; }
  .preview-bar .title {
    display: block; font-size: 14px; color: #333;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .preview-bar .tag { font-size: 12px; color: #999; }
  .preview-bar button {
    border: 1px solid rgba(0,0,0,.15); background: #fff; color: #333; border-radius: 6px;
    height: 30px; padding: 0 12px; font-size: 13px;
  }
  .preview-frame { flex: 1; width: 100%; border: 0; display: block; background: #525659; }
  /* pdf.js 画出来的连续页面：手机 WebView 内嵌 PDF 只能显示第一页（安卓根本不显示），所以自己画 */
  .pdf-pages {
    flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
    padding: 8px 0 24px; background: #525659;
    /* 双指缩放自己实现（见下面的 setZoom）：浏览器自身的手势关掉，单指拖动保留 */
    touch-action: pan-x pan-y;
  }
  #pagesInner { min-width: 100%; }
  .pdf-page {
    display: block; margin: 0 auto 10px; background: #fff;
    box-shadow: 0 1px 6px rgba(0,0,0,.45);
  }
  /* 还没画出来的页先占位：滚动到跟前再取数据、再画 */
  .pdf-slot { display: block; margin: 0 auto 10px; background: #525659; }
  .pdf-slot .pdf-page { margin: 0; }
  .preview-status { flex: 1; display: flex; align-items: center; justify-content: center; color: #ddd; font-size: 14px; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div class="preview-page">
  <div class="bar preview-bar" id="bar" hidden>
    <div class="grow">
      <span class="title" id="title"></span>
      <span class="tag" id="tag">只读预览</span>
    </div>
    <button id="zoomReset" hidden>100%</button>
    <button id="openExternal" hidden>用其他应用打开</button>
  </div>
  <div class="preview-status" id="status">正在生成预览…</div>
  <iframe class="preview-frame" id="frame" hidden></iframe>
  <div class="pdf-pages" id="pages" hidden><div id="pagesInner"></div></div>
</div>
<script>
/**
 * 只读 PDF 预览页：手机端打开文档先走这里。
 * 编辑器（ONLYOFFICE）打开一次要下十几 MB 静态资源，转成 PDF 通常只有几百 KB。
 *
 * 显示方式分两种：
 *  - 桌面（PC/Web）：用内置 PDF 查看器（iframe），带缩放/翻页/选中；
 *  - 手机 WebView：iOS 的 WKWebView 把 PDF 放进 iframe 只画第一页，安卓 WebView 不能内嵌 PDF，
 *    所以手机端用 pdf.js 把每一页画到 canvas 上，滚动浏览，各端表现一致。
 *
 * 地址：/doc/preview?fileId=123 或 /doc/preview?url=…&name=…
 */
(function () {
  'use strict';
  var D = window.PanDoc;
  var params = new URLSearchParams(location.search);
  var fileId = Number(params.get('fileId'));
  var viewUrl = params.get('url') || '';
  var viewName = params.get('name') || '';
  var $ = function (id) { return document.getElementById(id); };
  var box = $('pages');          // 滚动容器（不被缩放）
  var inner = $('pagesInner');   // 真正被缩放的内容容器
  var slots = [];                // 每页一个占位块，renderPages 里填充
  var pdfRef = null;             // 当前 pdf.js 文档，放大后重画要用
  function availWidth() { return Math.max(200, box.clientWidth - 16); }

  function fallbackToEditor(reason) {
    // 转不了（或渲染不出来）就退回编辑器，体验和以前一致
    var url = 'open?nopreview=1';
    if (fileId) url += '&fileId=' + fileId;
    if (viewUrl) url += '&url=' + encodeURIComponent(viewUrl);
    if (params.get('platform')) url += '&platform=' + encodeURIComponent(params.get('platform'));
    if (viewName) url += '&name=' + encodeURIComponent(viewName);
    console.warn('pan doc preview fallback:', reason);
    location.replace(url);
  }

  function isMobileClient() {
    if (params.get('platform') === 'mobile') return true;
    return /Android|iPhone|iPad|iPod|Mobile|HarmonyOS|OpenHarmony|Windows Phone/i.test(navigator.userAgent);
  }

  function showBar(title, pdfUrl) {
    document.title = title;
    $('title').textContent = title;
    $('bar').hidden = false;
    $('status').hidden = true;
    // 留一个出口：用户想用系统应用看、或某些 WebView 画不出来时。
    // 交给其它应用的是**原文**（docx/pptx/…），不是这一页预览用的转换后 PDF ——
    // 用户要的是"拿别的应用打开这个文件"，PDF 只是网页内预览的产物。
    var btn = $('openExternal');
    btn.hidden = false;
    btn.addEventListener('click', function () {
      originalUrl().then(function (u) {
        if (!u) {
          D.toast('取原文地址失败');
          return;
        }
        // 服务端在 pan.public_path 为空时给的是相对地址，这里补成绝对地址再交给客户端，
        // 否则各端拿到没有 scheme 的地址会静默失败
        D.downloadFile(new URL(u, location.href).href, title);
      })['catch'](function (e) {
        D.toast('取原文地址失败');
        console.warn('pan doc original url failed:', e);
      });
    });
  }

  /**
   * 原文地址：网盘文件取它的签名下载地址；按链接预览就是当时传进来的来源地址本身
   * （聊天文件消息、外部链接）。
   */
  function originalUrl() {
    if (fileId) {
      return D.api('files/url', { fileId: fileId }).then(function (u) {
        return (u && u.storageUrl) || '';
      });
    }
    return Promise.resolve(viewUrl || '');
  }

  /** 桌面：交给内置 PDF 查看器 */
  function showFrame(title, pdfUrl) {
    showBar(title, pdfUrl);
    var frame = $('frame');
    // 浏览器内置 PDF 查看器画好没有我们拿不到事件，取到 PDF（iframe load）就算就绪：
    // 宿主（客户端）据此收起「正在加载」，不然遮罩会一直盖着。
    frame.onload = function () { ready('frame'); };
    frame.src = pdfUrl;
    frame.hidden = false;
  }

  /** 通知宿主：预览页已经能看了（客户端据此收起加载遮罩，见 docs/doc-web-bridge.md） */
  function ready(source, extra) {
    var info = { source: 'preview', stage: source };
    if (extra) {
      for (var k in extra) { if (Object.prototype.hasOwnProperty.call(extra, k)) info[k] = extra[k]; }
    }
    try { D.docReady(info); } catch (e) { /* 客户端不支持就算了 */ }
  }

  /** 手机：pdf.js 逐页画到 canvas——只画要看的页，走 Range 边下边看，不整包下载 */
  function showPdfJs(title, pdfUrl) {
    showBar(title, pdfUrl);
    $('status').hidden = false;
    $('status').textContent = '正在打开…';
    loadScript(new URL('pdf.min.js', D.DOC_BASE).href).then(function () {
      var pdfjsLib = window.pdfjsLib;
      pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('pdf.worker.min.js', D.DOC_BASE).href;
      // disableStream / disableAutoFetch：让 pdf.js 用 HTTP Range 只取要用的分段。
      // 默认参数下它会先发一个「整包」请求再顺序读，第一页常常要等大半份 PDF 下完才出来。
      return pdfjsLib.getDocument({
        url: pdfUrl,
        withCredentials: true,
        disableStream: true,
        disableAutoFetch: true
      });
    }).then(function (task) {
      task.onProgress = function (p) {
        if (p && p.total > 0) {
          $('status').textContent = '正在打开… ' + Math.min(99, Math.round(p.loaded / p.total * 100)) + '%';
        }
      };
      return task.promise;
    }).then(function (pdf) {
      renderPages(pdf);
    })['catch'](function (e) {
      // pdf.js 出问题就退回编辑器（PC/网页上编辑器是好的）
      fallbackToEditor('pdf.js: ' + (e && e.message));
    });
  }

  /**
   * 先只画第 1 页，其余页滚到跟前再取、再画。
   * 大文档（几十上百页）不用一次性把整份 PDF 下完、也不用一次性画几百个 canvas。
   */
  function renderPages(pdf) {
    pdfRef = pdf;
    box.hidden = false;
    // 新文档：先回到 1 倍
    setZoom(1);
    slots = [];
    var queue = [];
    var busy = false;
    var shown = false;

    for (var n = 1; n <= pdf.numPages; n++) {
      var slot = document.createElement('div');
      slot.className = 'pdf-slot';
      slot.setAttribute('data-page', String(n));
      slot.style.width = availWidth() + 'px';
      slot.style.height = Math.round(availWidth() * 1.414) + 'px';   // 先按 A4 比例占位，画好后用实际高度
      inner.appendChild(slot);
      slots.push(slot);
    }

    function renderOne(n) {
      var slot = slots[n - 1];
      if (!slot || slot.getAttribute('data-done')) {
        return Promise.resolve();
      }
      slot.setAttribute('data-done', '1');
      return pdf.getPage(n).then(function (page) {
        var base = page.getViewport({scale: 1});
        var width = availWidth();
        var dpr = crispDpr();   // 按"当前"倍率画：放大后新滚到的页也不糊
        var viewport = page.getViewport({scale: width / base.width * dpr});
        var canvas = document.createElement('canvas');
        canvas.className = 'pdf-page';
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        canvas.style.width = width + 'px';
        canvas.style.height = Math.floor(viewport.height / dpr) + 'px';
        slot.style.height = '';
        slot.appendChild(canvas);
        if (!shown) {   // 第 1 页一出现就把「正在打开」收掉（渲染在 canvas 上继续）
          shown = true;
          $('status').hidden = true;
          ready('pdfjs', { pages: pdf.numPages });
        }
        return page.render({canvasContext: canvas.getContext('2d'), viewport: viewport}).promise
          .then(function () { page.cleanup(); });
      })['catch'](function (e) {
        slot.removeAttribute('data-done');   // 失败的下次滚到还能再试
        throw e;
      });
    }

    function pump() {
      if (busy || !queue.length) {
        return;
      }
      busy = true;
      var n = queue.shift();
      renderOne(n)['catch'](function (e) {
        console.warn('预览第 ' + n + ' 页失败', e && e.message);
      }).then(function () {
        busy = false;
        pump();
      });
    }

    function want(n) {
      if (queue.indexOf(n) < 0) {
        queue.push(n);
      }
      pump();
    }

    if (typeof IntersectionObserver === 'function') {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) {
            return;
          }
          want(Number(en.target.getAttribute('data-page')));
          io.unobserve(en.target);
        });
      }, {root: box, rootMargin: '150% 0px 150% 0px'});
      slots.forEach(function (s) { io.observe(s); });
    } else {
      // 老 WebView 没有 IntersectionObserver：退化成顺序全画
      slots.forEach(function (s, i) { want(i + 1); });
    }
  }

  // 暴露出来便于自测/排查（页面本身不依赖）
  window.PanPreview = {showPdfJs: showPdfJs, renderPages: renderPages, setZoom: setZoom};

  /* ---------------------------------------------------------------- 双指缩放
   * 手机上一页 A4 缩到屏幕宽常常看不清小字，这里让用户双指放大、单指拖动看。
   *
   * 做法：给内容容器加 CSS `zoom`（布局真的变大，横竖都能用原生滚动拖动，单指拖动
   * 不用自己实现）；手势停下后再把看得见的页按新倍率重画一遍，canvas 放大后不至于糊。
   */
  var MIN_ZOOM = 1, MAX_ZOOM = 4;
  var viewZoom = 1;
  var pinch = null;
  var crispTimer = null;

  /** canvas 的分辨率倍数：1 倍时沿用原来的 2（手机内存有限），放大后最多提到 4 */
  function crispDpr() {
    return Math.min(Math.min(window.devicePixelRatio || 1, 2) * viewZoom, 4);
  }

  function updateZoomChip() {
    var chip = $('zoomReset');
    if (!chip) return;
    chip.hidden = viewZoom === 1;
    chip.textContent = Math.round(viewZoom * 100) + '%';
  }

  /** 设定倍率。[mx],[my] 是手势中心（相对滚动容器的坐标），缩放时保持它下面的内容不动 */
  function setZoom(z, mx, my) {
    var next = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z));
    if (mx == null) { mx = box.clientWidth / 2; }
    if (my == null) { my = box.clientHeight / 2; }
    var cx = (box.scrollLeft + mx) / viewZoom;
    var cy = (box.scrollTop + my) / viewZoom;
    viewZoom = next;
    inner.style.zoom = viewZoom === 1 ? '' : String(viewZoom);
    box.scrollLeft = cx * viewZoom - mx;
    box.scrollTop = cy * viewZoom - my;
    updateZoomChip();
    scheduleCrisp();
  }

  /** 手势停下后（防抖）把看得见的页重画一遍 */
  function scheduleCrisp() {
    if (crispTimer) { clearTimeout(crispTimer); }
    crispTimer = setTimeout(redrawVisible, 260);
  }

  function redrawVisible() {
    if (!pdfRef || viewZoom === 1) { return; }
    var boxRect = box.getBoundingClientRect();
    slots.forEach(function (slot) {
      var r = slot.getBoundingClientRect();
      if (r.bottom < boxRect.top - 200 || r.top > boxRect.bottom + 200) { return; }
      redrawSlot(Number(slot.getAttribute('data-page')));
    });
  }

  /** 按当前倍率重画一页：先画好新 canvas 再替换，避免替换瞬间高度塌陷、画面跳 */
  function redrawSlot(n) {
    var slot = slots[n - 1];
    if (!slot || !slot.getAttribute('data-done') || slot.getAttribute('data-redrawing')) { return; }
    slot.setAttribute('data-redrawing', '1');
    pdfRef.getPage(n).then(function (page) {
      var base = page.getViewport({scale: 1});
      var width = availWidth();
      var dpr = crispDpr();
      var viewport = page.getViewport({scale: width / base.width * dpr});
      var canvas = document.createElement('canvas');
      canvas.className = 'pdf-page';
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      canvas.style.width = width + 'px';
      canvas.style.height = Math.floor(viewport.height / dpr) + 'px';
      return page.render({canvasContext: canvas.getContext('2d'), viewport: viewport}).promise
        .then(function () {
          var old = slot.querySelector('canvas');
          if (old) { slot.replaceChild(canvas, old); } else { slot.appendChild(canvas); }
          page.cleanup();
          slot.removeAttribute('data-redrawing');
        });
    })['catch'](function () { slot.removeAttribute('data-redrawing'); });
  }

  function touchDist(t) {
    var dx = t[0].clientX - t[1].clientX;
    var dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  box.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      pinch = {dist: touchDist(e.touches), zoom: viewZoom};
      e.preventDefault();   // 双指交给缩放，别让页面跟着滚
    }
  }, {passive: false});

  box.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 2 || !pinch) { return; }
    e.preventDefault();
    var rect = box.getBoundingClientRect();
    var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
    var my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
    setZoom(pinch.zoom * touchDist(e.touches) / pinch.dist, mx, my);
  }, {passive: false});

  box.addEventListener('touchend', function (e) {
    if (e.touches.length < 2) { pinch = null; }
    if (e.touches.length === 0) { scheduleCrisp(); }
  });

  // 双击：1 倍与 2 倍之间切换（看小字时最常用）
  var lastTap = 0, lastTapX = 0, lastTapY = 0;
  box.addEventListener('touchend', function (e) {
    if (e.touches.length !== 0 || e.changedTouches.length !== 1) { return; }
    var t = e.changedTouches[0];
    var now = Date.now();
    if (now - lastTap < 300 &&
        Math.abs(t.clientX - lastTapX) < 40 && Math.abs(t.clientY - lastTapY) < 40) {
      var rect = box.getBoundingClientRect();
      setZoom(viewZoom > 1 ? 1 : 2, t.clientX - rect.left, t.clientY - rect.top);
      lastTap = 0;
      return;
    }
    lastTap = now;
    lastTapX = t.clientX;
    lastTapY = t.clientY;
  });

  var zoomChip = $('zoomReset');
  if (zoomChip) {
    zoomChip.addEventListener('click', function () { setZoom(1); });
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('脚本加载失败')); };
      document.head.appendChild(s);
    });
  }

  if (!fileId && !viewUrl) {
    $('status').textContent = '缺少文件参数';
    ready('error', { reason: 'missing file param' });
    return;
  }

  D.api('docs/preview-pdf', fileId ? { fileId: fileId } : { url: viewUrl, name: viewName }).then(function (res) {
    if (!res || !res.url) {
      fallbackToEditor('no url');
      return;
    }
    var title = res.name || '文档预览';
    if (isMobileClient()) {
      showPdfJs(title, res.url);
      return;
    }
    // 桌面：先探一下 PDF 地址（过期/被清缓存时返回错误码），不行就退回编辑器
    return fetch(res.url, {method: 'HEAD', credentials: 'same-origin'}).then(function (r) {
      if (!r.ok) {
        fallbackToEditor('pdf http ' + r.status);
        return;
      }
      showFrame(title, res.url);
    })['catch'](function () {
      showFrame(title, res.url);
    });
  })['catch'](function (e) {
    fallbackToEditor(e && e.message);
  });
})();
</script>
</body>
</html>
