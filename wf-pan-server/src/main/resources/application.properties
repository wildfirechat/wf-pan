# Server ports
server.port=8081
server.admin-port=8080
server.servlet.session.timeout=24h

# Application
spring.application.name=wf-pan-server

# DataSource - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/wf_pan?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Storage (for delete sync)
storage.provider=none
storage.endpoint=http://localhost:9000
storage.access-key=minioadmin
storage.secret-key=minioadmin

# IM Service (野火IM服务配置)
im.server.admin_url=http://localhost:18080
im.server.admin_secret=123456

# Logging
logging.level.com.wildfirechat.pan=DEBUG

# Admin Permission Config
# 是否允许管理员管理用户私有空间（true/false）
pan.admin.manage-private-space=true
