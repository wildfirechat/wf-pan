# 本文件中的账号密码均为本地开发默认值，生产环境请通过外部配置文件
# (--spring.config.additional-location) 或环境变量覆盖，不要提交真实密钥。

# Server ports
server.port=8081
server.admin-port=8080
# 管理端口监听地址，部署在 nginx 后面时建议设为 127.0.0.1，为空则监听所有网卡
server.admin-address=
server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# 由容器解析 X-Forwarded-For 等代理头，只信任内网代理（nginx），客户端无法伪造 IP
server.forward-headers-strategy=native

# Application
spring.application.name=wf-pan-server

# DataSource - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/wf_pan?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# IM Service (野火IM服务配置)
im.server.admin_url=http://localhost:18080
im.server.admin_secret=123456

# Logging
logging.level.com.wildfirechat.pan=INFO

# Admin Config
# 是否允许管理员（管理后台及全局管理员）访问用户私有空间（true/false）
pan.admin.manage-private-space=false
# 首次启动时初始管理员 admin 的密码；不配置则随机生成并打印到日志（仅一次）
pan.admin.initial_password=


# Media Storage Configuration
# 1: 七牛云存储, 2: 阿里云对象存储, 3: 野火私有对象存储, 4: 对象存储网关
# 5: 腾讯云存储, 6: 华为云存储, 7: AWS S3, 8: 京东云存储
media.type=0
media.server_url=http://localhost:9000
media.access_key=minioadmin
media.secret_key=minioadmin
media.bucket=wf-pan
# 除网盘 bucket 外，允许客户端引用或复制（copy=true）的 URL 前缀，逗号分隔。
# 保存 IM 文件消息到网盘时，需把 IM 文件所在 bucket 的访问地址配置在这里，例如：
# media.trusted_url_prefixes=http://localhost:9000/media/
media.trusted_url_prefixes=

# 阿里云OSS特有配置（media.type=2时使用）
# 如果不配置，会从media.server_url解析
# media.aliyun.endpoint=oss-cn-hangzhou.aliyuncs.com

# 腾讯云COS特有配置（media.type=5时使用）
# media.tencent.region=ap-guangzhou

# 华为云OBS特有配置（media.type=6时使用）
# media.huawei.endpoint=obs.cn-north-4.myhuaweicloud.com

# AWS S3特有配置（media.type=7时使用）
# media.aws.region=us-east-1

# 京东云OSS特有配置（media.type=8时使用）
# media.jdcloud.endpoint=s3.cn-north-1.jdcloud-oss.com

# ---------------- 在线文档（ONLYOFFICE Docs）----------------
# 是否启用在线文档（新建/打开编辑器/转换）；关闭时网盘其余功能照常
docs.enabled=false
# 与 ONLYOFFICE 共用的 JWT 密钥（HS256），两边必须一致；部署时随机生成
docs.jwt_secret=
# 本服务调 ONLYOFFICE 的内网地址（转换接口、取保存结果）
docs.server_internal_url=http://wf-docs
# 浏览器加载编辑器用的路径（与网盘页面同源，由 NG 反代到 ONLYOFFICE）
docs.server_public_path=/docs
# ONLYOFFICE 回连本服务的地址（取文件、保存回调），只在容器网络内可达
docs.callback_base_url=http://wf-pan:8081

# ---------------- 分享 / 版本 / 下载 ----------------
# 网盘在对外入口上的路径前缀（NG 把 /pan/ 去掉前缀转给客户端端口）
pan.public_path=/pan
# 每个文件保留的历史版本数（含当前版本）
pan.version.keep=30
# 下载链接有效期（秒）
pan.download.ttl_seconds=600
# 群成员关系缓存（秒）：退群后最长这么久才失去群分享的权限
pan.group_cache_seconds=60
# 在线文档页面会话有效期（秒）
pan.web_session_ttl_seconds=43200
# 下载链接、网页会话的签名密钥；不配置时启动时随机生成（重启后已发出的链接失效）
pan.sign_secret=
