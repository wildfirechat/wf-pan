# ============================================
# 管理后台端口配置 - panadmin.wildfirechat.net
# 转发到后端管理端口 (8080)
# ============================================

server {
    listen 80;
    server_name panadmin.wildfirechat.net;

    # 管理后台涉及管理员密码和会话，只允许通过 HTTPS 访问
    return 301 https://$server_name$request_uri;
}

# HTTPS 配置（需要 SSL 证书）
server {
    listen 443 ssl http2;
    server_name panadmin.wildfirechat.net;
    
    # SSL 证书配置（请替换为实际证书路径）
    ssl_certificate /path/to/panadmin.wildfirechat.net.crt;
    ssl_certificate_key /path/to/panadmin.wildfirechat.net.key;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        # 建议只允许内网或办公网访问管理后台
        # allow 192.168.1.0/24;
        # deny all;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8080;
    }
}
